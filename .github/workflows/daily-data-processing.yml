name: Daily data processing

on:
  schedule:
    - cron: '0 0 * * *'  # every day at midnight UTC
  workflow_dispatch: {}

jobs:
  run-scripts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas pyarrow datetime pathlib numpy matplotlib.pyplot

      - name: Run buoy data script
        run: |
          python src/01_getBuoyData.py

      - name: Run mixing metrics script
        run: |
          python src/02_calcMixing.py
